<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automaix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 700px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 0.05em;
            margin-bottom: 50px;
        }
        .message {
            font-size: 1.1rem;
            line-height: 2;
            color: #333;
            margin-bottom: 40px;
        }
        .company {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AUTOMAIX</div>
        <div class="message">
            現在、会社設立の登記手続きを進めており、9月18日に設立する予定です。<br>
            設立後、公式ウェブサイトにて改めてお知らせいたします。
        </div>
        <div class="company">株式会社Automaix</div>
    </div>
</body>
</html>
